name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Neon-Dash-Setup
          path: release/Neon-Dash-Setup-*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-${{ github.run_number }}
          name: Neon Dash Setup (build ${{ github.run_number }})
          files: release/Neon-Dash-Setup-*.exe
