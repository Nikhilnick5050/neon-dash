<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgb(28,10,64)"/>
      <stop offset="100%" stop-color="rgb(8,4,24)"/>
    </radialGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgb(0,200,255)" stop-opacity="0"/>
      <stop offset="50%" stop-color="rgb(0,200,255)" stop-opacity="1"/>
      <stop offset="100%" stop-color="rgb(0,200,255)" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6.144" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="disc"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <g clip-path="url(#disc)">
    <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
    <rect x="184.32" y="0" width="143.36" height="512" fill="url(#lane)"/>
  </g>
  <circle cx="256" cy="256" r="209.92" fill="none" stroke="rgb(255,40,200)" stroke-width="23.04" filter="url(#glow)"/>
</svg>